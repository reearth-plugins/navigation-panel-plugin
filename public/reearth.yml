id: reearth-visualizer-plugin-navigation-panel
name: Visualizer plugin navigation panel
version: 0.0.1
extensions:
  - id: navigation_panel
    type: widget
    name: Navigation Panel
    schema:
      groups:
        - id: general
          title: General
          fields:
            - id: home
              title: Home Camera Position
              type: camera
              description: Set the default camera position for the home button
        - id: appearance
          title: Appearance
          fields:
            - id: size
              title: Size
              type: string
              defaultValue: medium
              choices:
                - key: small
                  label: Small
                - key: medium
                  label: Medium
                - key: large
                  label: Large
            - id: background_color
              title: Background color
              type: string
              ui: color
            - id: icon_color
              title: Icon color
              type: string
              ui: color
            - id: corner_radius
              title: Corner radius
              type: number
              unit: px
            - id: show_border
              title: Show border
              type: bool
              defaultValue: false
            - id: border_color
              title: Border color
              type: string
              ui: color
              availableIf:
                field: show_border
                type: bool
                value: true
            - id: border_width
              title: Border width
              type: number
              unit: px
              availableIf:
                field: show_border
                type: bool
                value: true
